name: Test Journal-Utilities

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs call the repository's gate entry point (`run.py gate`), which is also
# what a contributor runs locally: the arm commands exist once, in
# `gate_commands()` in run.py. See docs/RUN_GUIDE.md.

jobs:
  gate:
    name: Gate (lint · format · types · tests · docs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # The extras the suite imports; the GPU / Apple-Silicon transcription
      # extras are lazy and are not needed by any arm. One environment, one sync.
      - name: Sync the locked gate environment
        run: uv sync --frozen --extra rag --extra interface --extra export --dev

      - name: Run the gate arms
        run: uv run --frozen python run.py gate lint format types test docs

  # GNN pin: .github/gnn-pin.json (schema gnn-importer-pin/v1, v5.0.3,
  # 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1). The arm installs only the pinned
  # parser, so this job does not sync the project environment.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Run the pinned conformance arm
        run: uv run --no-project python run.py gate gnn
