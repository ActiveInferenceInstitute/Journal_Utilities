# Pre-commit gates — mirror the `gate` job in .github/workflows/test.yml:
# ruff check, ruff format, mypy on src (the same arms `run.py gate` runs).
# Replaces black: ruff format is the repo formatter (see [tool.ruff] in
# pyproject.toml); the black config/dev-dep removal is tracked in TODO.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (src)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]