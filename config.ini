; =============================================================================
; Journal-Utilities Configuration
; =============================================================================
; This config file controls all pipeline options. Edit values below and run:
;   python run.py          (run default pipeline; use --help for usage)
;   python run.py config   (show current config)
;   python run.py export   (export transcripts)
;   python run.py download (download from YouTube)
;
; Boolean values: true / false
; Empty values use defaults
; =============================================================================

[general]
; Base data directory (relative to project root)
data_dir = data/output
; Logging level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

[download]
; Download transcripts (subtitles) from YouTube
transcripts = true
; Download audio files (MP3)
audio = true
; Download video files (MP4)
video = false
; Resume interrupted downloads (skip existing files)
resume = true
; Maximum videos to process (0 = unlimited)
max_videos = 0
; Delay between downloads in seconds
delay = 1
; Browser to extract cookies from (e.g. chrome, firefox, or leave empty)
cookies_from_browser =
; Audio format: mp3, wav, m4a
audio_format = mp3
; Video quality: best, 720p, 480p, 360p
video_quality = best
; Transcript languages (comma-separated)
transcript_languages = en

[transcribe]
; Transcription engine: mlx-whisper (Apple Silicon) or whisperx (GPU/CUDA)
engine = mlx-whisper
; Model identifier
model = mlx-community/whisper-large-v3-turbo
; Maximum files to transcribe (0 = unlimited)
max_files = 0

[export]
; Enable plaintext export (.txt)
plaintext = true
; Enable PDF export (.pdf) — requires: uv pip install fpdf2
pdf = true
; Enable Markdown export (.md) with YAML frontmatter
markdown = true
; Enable JSON export (.json) with metadata
json = true
; Enable HTML export (.html) standalone pages
html = true
; Export output directory (relative to project root)
output_dir = data/export

[interface]
; Web interface bind host
host = 0.0.0.0
; Web interface port
port = 8000

[database]
; SurrealDB connection URL
url = ws://localhost:8080/rpc
; Database credentials
user = root
password = root
; Database namespace and name
namespace = actinf
database = actinf

[pipeline]
; Enable/disable individual default-pipeline steps (python run.py)
config = true
validate = true
export = true
test = true
serve = true
; If true, test failures abort the pipeline (default: true = fail closed)
test_strict = true
