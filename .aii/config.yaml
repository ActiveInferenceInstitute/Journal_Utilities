# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-12'
repo:
  name: Journal-Utilities
  slug: journal-utilities
  full_name: ActiveInferenceInstitute/Journal_Utilities
  description: A modular, config-driven pipeline for downloading, transcribing, extracting,
    exporting, browsing, and chatting with the Active Inference Institute video library.
institute:
  category: publication
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/ActiveInferenceJournal
    relation: referenced-by
    note: Featured in Institute materials.
  links:
    github: https://github.com/ActiveInferenceInstitute/Journal_Utilities
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: run.py
  kind: code
  description: Pipeline CLI runner (config/export/download/serve/test/full/journal-check).
- path: src
  kind: code
  description: Source tree.
- path: scripts
  kind: code
  description: CLI tools and journal maintenance scripts.
- path: Makefile
  kind: code
  description: Convenience targets wrapping the CLIs and gates.
- path: pyproject.toml
  kind: code
  description: Python package config.
- path: LICENSE
  kind: doc
  description: License.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: tests
  kind: test
  description: Test suite.
- path: docs
  kind: doc
  description: Documentation tree.
provenance:
  license: CC0-1.0
  citation:
    text: Active Inference Institute — Journal-Utilities.
instituteos:
  tags:
  - journal
  - video-library
  - transcription
  - pipeline
  - python
capabilities:
- python-package
- tested
- documentation
- ci
- citation
tasks:
  lint:
    cmd: uv run python run.py gate lint
    description: Run the gate linter.
  format:
    cmd: uv run python run.py gate format
    description: Check formatting through the gate.
  types:
    cmd: uv run python run.py gate types
    description: Run the gate type checker.
  test:
    cmd: uv run python run.py gate test
    description: Run the CI test selection.
  test-full:
    cmd: uv run python run.py gate test-full
    description: Run tests with coverage, including reachable live downloads.
  docs:
    cmd: uv run python run.py gate docs
    description: Check docs/documentation-index.md, links and the Publishing pins. No manuscript command.
  gnn:
    cmd: uv run python run.py gate gnn
    description: Check GNN conformance using .github/gnn-pin.json.
docs:
- README.md
- AGENTS.md
- docs/documentation-index.md
- docs/README.md
- docs/AGENTS.md
- docs/workflows/publishing.md
schema: aii-sidecar/v1
