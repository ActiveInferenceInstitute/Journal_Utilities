[project]
name = "journal-utilities"
version = "0.1.0"
description = "Transcription, entity extraction, and processing pipeline for the Active Inference Journal"
readme = "README.md"
requires-python = ">=3.12"
license = "CC0-1.0"
authors = [
    { name = "Holly Grimm", email = "Holly@ActiveInference.Institute" },
    { name = "Daniel Ari Friedman", email = "Daniel@ActiveInference.Institute" },
    { name = "Active Inference Institute" }
]

dependencies = [
    # Pipeline core — light install; heavy deps live in the extras below
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyytdata>=0.1.0",
    "requests>=2.32.0",
    "yt-dlp>=2025.9.26",
    "youtube-transcript-api>=0.6.0",
]

[project.optional-dependencies]
# WhisperX (torch + diarization) — the heavy GPU transcription stack
transcribe = [
    "whisperx @ git+https://github.com/m-bain/whisperX.git",
]
# Entity extraction / JournalRAG
rag = [
    "cohere>=5.11.0",
    "structlog>=25.5.0",
    "surrealdb>=1.0.6",
]
transcribe-local = [
    "mlx-whisper>=0.4.0",
]
interface = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
]
export = [
    "fpdf2>=2.8.0",
]

[project.scripts]
journal-ui = "journal_utilities.interface.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/journal_utilities"]

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "mypy>=1.8.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
# E501 (line-too-long) is enforced by the formatter (`ruff format`, the
# `make format` gate), not the linter — turning it off here matches that split
# and keeps `make lint` meaningful rather than reformatting-driven.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E402"]
# Legacy, untyped WhisperX orchestration module (GPU, heavy deps); annotating
# it is a dedicated refactor, not part of a lint-gate enforcement pass.
"src/journal_utilities/transcribe/transcribe.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Allow bare ``dict``/``list`` without type args (pervasive across legacy
# modules); high-value strict checks (no-any-return, union-attr, no-untyped-def,
# operator) remain enabled.
disallow_any_generics = false
# Third-party SDKs (surrealdb, pyytdata, mlx_whisper, cohere, whisperx) ship
# without stubs; typing them is out of our control, so don't fail the gate on
# their missing stubs.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Legacy, untyped modules that call third-party SDKs without stubs/tight types
# (Cohere v2 client) or are fundamentally untyped GPU orchestration. Annotating
# them is a dedicated refactor; keep the gate green everywhere else meanwhile.
module = [
    "journal_utilities.transcribe.transcribe",
    "journal_utilities.rag.extractors.cohere_extractor",
]
ignore_errors = true
